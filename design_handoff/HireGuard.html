<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F7F5;--bg-2:#EFEDE9;--bg-3:#E5E2DC;
  --fg:#141311;--fg-2:#6B6860;--fg-3:#9E9B96;
  --border:rgba(0,0,0,0.08);--border-2:rgba(0,0,0,0.05);
  --accent:oklch(0.62 0.12 210);--accent-dim:oklch(0.62 0.12 210/0.12);--accent-mid:oklch(0.62 0.12 210/0.25);
  --green:oklch(0.58 0.12 155);--green-dim:oklch(0.58 0.12 155/0.12);
  --amber:oklch(0.65 0.13 72);--amber-dim:oklch(0.65 0.13 72/0.12);
  --red:oklch(0.58 0.14 22);--red-dim:oklch(0.58 0.14 22/0.12);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
  --r:12px;--r-sm:8px;--tr:200ms cubic-bezier(0.25,0.46,0.45,0.94);--tr-s:380ms cubic-bezier(0.25,0.46,0.45,0.94);
}
.dark{
  --bg:#111110;--bg-2:#1A1917;--bg-3:#242220;
  --fg:#F2F0EB;--fg-2:#9C9A95;--fg-3:#5C5A56;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.30);--shadow:0 4px 16px rgba(0,0,0,0.35);--shadow-lg:0 12px 40px rgba(0,0,0,0.50);
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:15px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:99px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
@keyframes slideR{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
</style>

// ─── Utils ───────────────────────────────────────────────────────────────────
const rc = r => r==="low"?"var(--green)":r==="medium"?"var(--amber)":"var(--red)";
const rb = r => r==="low"?"var(--green-dim)":r==="medium"?"var(--amber-dim)":"var(--red-dim)";
const sc = s => s==="Offer"?"var(--green)":s==="Screening"?"var(--accent)":s==="Review"?"var(--amber)":"var(--fg-3)";
const sb = s => s==="Offer"?"var(--green-dim)":s==="Screening"?"var(--accent-dim)":s==="Review"?"var(--amber-dim)":"var(--border)";
const checkPassCount = c => c.checks.filter(x=>x.status==="pass").length;

const Icon = ({ d, size=16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round">
    {d.split(' M').map((p,i)=><path key={i} d={i===0?p:'M'+p}/>)}
  </svg>
);

const Avatar = ({ initials, size=34 }) => {
  const hue = (initials.charCodeAt(0)*7+(initials.charCodeAt(1)||0)*13)%360;
  return (
    <div style={{width:size,height:size,borderRadius:"50%",flexShrink:0,
      background:`oklch(0.62 0.10 ${hue}/0.16)`,border:`1.5px solid oklch(0.62 0.10 ${hue}/0.28)`,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:size*0.34,fontWeight:500,color:`oklch(0.52 0.12 ${hue})`,letterSpacing:"0.02em"}}>
      {initials}
    </div>
  );
};

const ScoreRing = ({ score, size=54 }) => {
  const r=(size-7)/2, circ=2*Math.PI*r;
  const color = score>=80?"var(--green)":score>=60?"var(--amber)":"var(--red)";
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-3)" strokeWidth={3.5}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={3.5}
          strokeDasharray={`${circ*score/100} ${circ*(1-score/100)}`} strokeLinecap="round"
          style={{transition:"stroke-dasharray 0.9s cubic-bezier(0.25,0.46,0.45,0.94)"}}/>
      </svg>
      <span style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",
        fontSize:size*0.24,fontWeight:600,letterSpacing:"-0.03em",color}}>{score}</span>
    </div>
  );
};

const Badge = ({ label, color, bg, border }) => (
  <span style={{fontSize:12,fontWeight:500,color,background:bg,padding:"3px 10px",borderRadius:99,
    border:`1px solid ${border||color+'33'}`,whiteSpace:"nowrap"}}>{label}</span>
);

// ─── Stat Card ───────────────────────────────────────────────────────────────
const StatCard = ({ label, value, delta, icon, sub, delay=0 }) => {
  const [vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t)},[delay]);
  const pos = delta && (delta.startsWith("+")||delta.endsWith("↑"));
  return (
    <div style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(14px)",
      transition:`opacity 0.45s ease,transform 0.45s ease`,
      background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",
      padding:"22px 24px",display:"flex",flexDirection:"column",gap:14,boxShadow:"var(--shadow-sm)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,color:"var(--fg-2)",fontWeight:400,letterSpacing:"0.01em"}}>{label}</span>
        <span style={{color:"var(--fg-3)",opacity:0.65}}><Icon d={icon} size={15}/></span>
      </div>
      <div>
        <div style={{display:"flex",alignItems:"baseline",gap:8}}>
          <span style={{fontSize:32,fontWeight:500,letterSpacing:"-0.04em",color:"var(--fg)",lineHeight:1}}>{value}</span>
          {delta&&<span style={{fontSize:12.5,fontWeight:500,color:pos?"var(--green)":"var(--red)"}}>{delta}</span>}
        </div>
        {sub&&<div style={{fontSize:12,color:"var(--fg-3)",marginTop:5}}>{sub}</div>}
      </div>
    </div>
  );
};

// ─── Candidate Row ────────────────────────────────────────────────────────────
const CandidateRow = ({ c, selected, onClick, delay=0, compact=false }) => {
  const [vis,setVis]=useState(false);
  const [hov,setHov]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t)},[delay]);
  const passes=checkPassCount(c);
  return (
    <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{
      opacity:vis?1:0,transform:vis?"translateX(0)":"translateX(-10px)",
      transition:`opacity 0.4s ease,transform 0.4s ease,background var(--tr)`,
      display:"flex",alignItems:"center",gap:12,padding:compact?"10px 12px":"13px 14px",
      borderRadius:"var(--r-sm)",cursor:"pointer",
      background:selected?"var(--accent-dim)":hov?"var(--bg-3)":"transparent",
      borderLeft:selected?"2.5px solid var(--accent)":"2.5px solid transparent",
    }}>
      <Avatar initials={c.avatar} size={compact?32:38}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:14,fontWeight:500,color:"var(--fg)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</span>
          {c.verified&&<span style={{color:"var(--accent)",flexShrink:0,lineHeight:0}}><Icon d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" size={13}/></span>}
        </div>
        <div style={{fontSize:12,color:"var(--fg-3)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.role}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
        <Badge label={c.stage} color={sc(c.stage)} bg={sb(c.stage)}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11.5,color:rc(c.risk),background:rb(c.risk),padding:"2px 8px",borderRadius:99,fontWeight:500,textTransform:"capitalize"}}>{c.risk} risk</span>
          <span style={{fontSize:11,color:"var(--fg-3)"}}>{passes}/6</span>
        </div>
      </div>
    </div>
  );
};

// ─── Check Item ───────────────────────────────────────────────────────────────
const CheckItem = ({ check, delay=0 }) => {
  const [vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t)},[delay]);
  const iPass=check.status==="pass", iFail=check.status==="fail";
  const icon=iPass?"M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z":iFail?"M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z":"M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z";
  const color=iPass?"var(--green)":iFail?"var(--red)":"var(--amber)";
  const bgc=iPass?"var(--green-dim)":iFail?"var(--red-dim)":"var(--amber-dim)";
  return (
    <div style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(6px)",transition:"opacity 0.35s ease,transform 0.35s ease",
      display:"flex",alignItems:"center",gap:13,padding:"11px 0",borderBottom:"1px solid var(--border-2)"}}>
      <span style={{color,flexShrink:0}}><Icon d={icon} size={17}/></span>
      <div style={{flex:1}}>
        <div style={{fontSize:13.5,fontWeight:500,color:"var(--fg)"}}>{check.label}</div>
        <div style={{fontSize:12,color:"var(--fg-3)",marginTop:2}}>{check.detail}</div>
      </div>
      <span style={{fontSize:11.5,fontWeight:500,color,background:bgc,padding:"3px 10px",borderRadius:99,textTransform:"capitalize",flexShrink:0}}>{check.status}</span>
    </div>
  );
};

// ─── Activity Item ────────────────────────────────────────────────────────────
const ActivityItem = ({ a, delay=0 }) => {
  const [vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t)},[delay]);
  const dot=a.type==="success"?"var(--green)":a.type==="warning"?"var(--amber)":"var(--accent)";
  const dbg=a.type==="success"?"var(--green-dim)":a.type==="warning"?"var(--amber-dim)":"var(--accent-dim)";
  return (
    <div style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(6px)",transition:`opacity 0.4s ease,transform 0.4s ease`,
      display:"flex",gap:13,alignItems:"flex-start"}}>
      <div style={{paddingTop:5,flexShrink:0}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:dot,boxShadow:`0 0 0 3px ${dbg}`}}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13.5,fontWeight:500,color:"var(--fg)"}}>{a.text}</div>
        <div style={{fontSize:12,color:"var(--fg-3)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.sub}</div>
      </div>
      <span style={{fontSize:11.5,color:"var(--fg-3)",whiteSpace:"nowrap",paddingTop:2,flexShrink:0}}>{a.time}</span>
    </div>
  );
};

// ─── Candidates ───────────────────────────────────────────────────────────────
const CandidatesView = ({ selected, onSelect }) => {

  const stages=["All","Screening","Interview","Review","Offer"];
  const filtered=CANDIDATES.filter(c=>{
    const q=query.toLowerCase();
    const matchQ=!q||c.name.toLowerCase().includes(q)||c.role.toLowerCase().includes(q)||c.dept.toLowerCase().includes(q);
    const matchS=filter==="All"||c.stage===filter;
    return matchQ&&matchS;
  });
  return (
    <div style={{display:"grid",gridTemplateColumns:"320px 1fr",gap:14,height:"100%",animation:"fadeIn 0.35s both"}}>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>

// ─── Checks ───────────────────────────────────────────────────────────────────
const ChecksView = () => {
  const [selected,setSelected]=useState(null);
  const allChecks=CANDIDATES.flatMap(c=>c.checks.map(ck=>({...ck,candidate:c})));
  const passes=allChecks.filter(x=>x.status==="pass").length;
  const pending=allChecks.filter(x=>x.status==="pending").length;
  const fails=allChecks.filter(x=>x.status==="fail").length;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,animation:"fadeUp 0.4s both"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
        {[[allChecks.length,"Total Checks","var(--fg)","var(--bg-2)"],[passes,"Passed","var(--green)","var(--green-dim)"],[pending,"Pending","var(--amber)","var(--amber-dim)"],[fails,"Failed","var(--red)","var(--red-dim)"]].map(([v,l,c,bg],i)=>(
          <div key={l} style={{background:bg,border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"20px 22px",boxShadow:"var(--shadow-sm)",animation:`fadeUp 0.4s ${i*60}ms both`}}>
            <div style={{fontSize:13,color:c==="var(--fg)"?"var(--fg-2)":c,marginBottom:10,opacity:0.75}}>{l}</div>
            <div style={{fontSize:32,fontWeight:500,color:c,letterSpacing:"-0.04em",lineHeight:1}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1.4fr",gap:14}}>
        {/* Candidates column */}
        <div style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"18px 14px",boxShadow:"var(--shadow-sm)"}}>
          <div style={{fontSize:13.5,fontWeight:500,marginBottom:14,padding:"0 4px"}}>By Candidate</div>
          {CANDIDATES.map((c,i)=>{
            const p=checkPassCount(c), f=c.checks.filter(x=>x.status==="fail").length, pd=c.checks.filter(x=>x.status==="pending").length;
            const overall=f>0?"fail":pd>0?"pending":"pass";
            const iCon=overall==="pass"?"M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z":overall==="fail"?"M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z":"M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z";
            const iCol=overall==="pass"?"var(--green)":overall==="fail"?"var(--red)":"var(--amber)";
            return (
              <div key={c.id} onClick={()=>setSelected(selected?.id===c.id?null:c)} style={{
                display:"flex",alignItems:"center",gap:11,padding:"10px 10px",borderRadius:"var(--r-sm)",cursor:"pointer",
                background:selected?.id===c.id?"var(--accent-dim)":"transparent",
                transition:"background var(--tr)",animation:`slideR 0.4s ${i*30}ms both`,
              }}
              onMouseEnter={e=>{if(selected?.id!==c.id)e.currentTarget.style.background="var(--bg-3)"}}
              onMouseLeave={e=>{if(selected?.id!==c.id)e.currentTarget.style.background="transparent"}}>
                <Avatar initials={c.avatar} size={30}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
                  <div style={{fontSize:11.5,color:"var(--fg-3)",marginTop:1}}>{p}/6 passed</div>
                </div>
                <span style={{color:iCol,flexShrink:0}}><Icon d={iCon} size={16}/></span>
              </div>
            );
          })}
        </div>
        {/* Check detail */}
        <div style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"22px",boxShadow:"var(--shadow-sm)"}}>
          {selected
            ? <div key={selected.id} style={{animation:"fadeUp 0.3s both"}}>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
                  <Avatar initials={selected.avatar} size={38}/>
                  <div>
                    <div style={{fontSize:15,fontWeight:500}}>{selected.name}</div>
                    <div style={{fontSize:12.5,color:"var(--fg-3)",marginTop:2}}>{selected.role}</div>
                  </div>
                  <ScoreRing score={selected.score} size={44}/>
                </div>
                {selected.checks.map((ck,i)=><CheckItem key={ck.label} check={ck} delay={i*40}/>)}
              </div>
            : <div style={{height:"100%",minHeight:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,color:"var(--fg-3)"}}>
                <Icon d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-2.981z" size={28}/>
                <span style={{fontSize:13.5,fontWeight:500}}>Select a candidate</span>
                <span style={{fontSize:13}}>View their check details</span>
              </div>
          }
        </div>
      </div>
    </div>
  );
};

// ─── Reports ──────────────────────────────────────────────────────────────────
const ReportsView = () => {
  const weeks=[{w:"Mar 31",apps:5,offers:1},{w:"Apr 7",apps:8,offers:2},{w:"Apr 14",apps:6,offers:1},{w:"Apr 21",apps:10,offers:2}];
  const maxApps=Math.max(...weeks.map(w=>w.apps));
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16,animation:"fadeUp 0.4s both"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        {/* Hiring funnel */}
        <div style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"22px",boxShadow:"var(--shadow-sm)"}}>
          <div style={{fontSize:14,fontWeight:500,marginBottom:18}}>Hiring Funnel — April 2026</div>
          {[["Applications","10","100%","var(--accent)"],["Screening","8","80%","var(--accent)"],["Interview","5","50%","var(--amber)"],["Review","3","30%","var(--amber)"],["Offer","2","20%","var(--green)"],["Accepted","2","20%","var(--green)"]].map(([label,n,pct,color],i)=>(
            <div key={label} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,animation:`slideR 0.4s ${i*55}ms both`}}>
              <span style={{fontSize:13,color:"var(--fg-2)",width:88,flexShrink:0}}>{label}</span>
              <div style={{flex:1,height:10,background:"var(--bg-3)",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:99,background:color,width:pct,transition:"width 0.8s cubic-bezier(0.25,0.46,0.45,0.94)"}}/>
              </div>
              <span style={{fontSize:13,fontWeight:500,color,width:20,textAlign:"right"}}>{n}</span>
            </div>
          ))}
        </div>
        {/* Weekly trend */}
        <div style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"22px",boxShadow:"var(--shadow-sm)"}}>
          <div style={{fontSize:14,fontWeight:500,marginBottom:18}}>Weekly Applications</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:14,height:120,marginBottom:8}}>
            {weeks.map((w,i)=>(
              <div key={w.w} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                <div style={{width:"100%",display:"flex",flexDirection:"column",alignItems:"center",gap:3,justifyContent:"flex-end",height:"100%"}}>
                  <span style={{fontSize:12,fontWeight:500,color:"var(--fg)"}}>{w.apps}</span>
                  <div style={{width:"100%",borderRadius:"6px 6px 0 0",background:"var(--accent)",opacity:0.85,
                    height:`${(w.apps/maxApps)*90}%`,minHeight:8,
                    animation:`fadeUp 0.6s ${i*80}ms both`,transition:"height 0.8s cubic-bezier(0.25,0.46,0.45,0.94)"}}/>
                </div>
                <span style={{fontSize:11.5,color:"var(--fg-3)"}}>{w.w}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
        {[["Avg. Time to Offer","18 days","−3 days vs. last month","var(--green)"],["Check Completion Rate","87%","+5% vs. last month","var(--green)"],["Offer Acceptance Rate","100%","2 of 2 offers accepted","var(--green)"]].map(([l,v,sub,c],i)=>(
          <div key={l} style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"20px 22px",boxShadow:"var(--shadow-sm)",animation:`fadeUp 0.4s ${i*70}ms both`}}>
            <div style={{fontSize:13,color:"var(--fg-2)",marginBottom:10}}>{l}</div>
            <div style={{fontSize:30,fontWeight:500,letterSpacing:"-0.04em",color:"var(--fg)",lineHeight:1,marginBottom:6}}>{v}</div>
            <div style={{fontSize:12,color:c}}>{sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
};

// ─── Settings ─────────────────────────────────────────────────────────────────
const SettingsView = () => (
  <div style={{display:"flex",flexDirection:"column",gap:14,maxWidth:600,animation:"fadeUp 0.4s both"}}>
    {[
      {section:"Profile",fields:[{l:"Full Name",v:"Sarah Lee",t:"text"},{l:"Email",v:"sarah.lee@hireguard.io",t:"email"},{l:"Role",v:"HR Manager",t:"text"}]},
      {section:"Notifications",fields:[{l:"Email alerts on risk flags",v:"On",t:"toggle"},{l:"Weekly digest",v:"On",t:"toggle"},{l:"Candidate status updates",v:"Off",t:"toggle"}]},
      {section:"Integrations",fields:[{l:"ATS Connection",v:"Greenhouse",t:"text"},{l:"Background Check Provider",v:"Checkr",t:"text"}]},
    ].map(({section,fields})=>(
      <div key={section} style={{background:"var(--bg-2)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"20px 22px",boxShadow:"var(--shadow-sm)"}}>
        <div style={{fontSize:13.5,fontWeight:500,marginBottom:14}}>{section}</div>
        {fields.map((f,i)=>(
          <div key={f.l} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:i<fields.length-1?"1px solid var(--border-2)":"none"}}>
            <span style={{fontSize:13.5,color:"var(--fg-2)"}}>{f.l}</span>
            {f.t==="toggle"
              ? <div style={{width:38,height:22,borderRadius:99,background:f.v==="On"?"var(--accent)":"var(--bg-3)",padding:2,cursor:"pointer",transition:"background var(--tr)",border:"1px solid var(--border)"}}>
                  <div style={{width:18,height:18,borderRadius:"50%",background:"#fff",marginLeft:f.v==="On"?16:0,transition:"margin-left var(--tr)",boxShadow:"var(--shadow-sm)"}}/>
                </div>
              : <span style={{fontSize:13.5,color:"var(--fg)",fontWeight:500}}>{f.v}</span>
            }
          </div>
        ))}
      </div>
    ))}
  </div>
);

// ─── App Shell ────────────────────────────────────────────────────────────────
function App() {
  const [dark,setDark]=useState(()=>{
    const s=localStorage.getItem('hg-dark');
    return s!==null?s==='true':window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  const [nav,setNav]=useState(()=>localStorage.getItem('hg-nav')||'dashboard');
  const [selected,setSelected]=useState(null);
  const [collapsed,setCollapsed]=useState(false);
  const [tweaks,setTweaks]=useState(false);

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentHue": 210,
    "density": "comfortable",
    "fontScale": 1
  }/*EDITMODE-END*/;
  const [tw,setTw]=useState(TWEAK_DEFAULTS);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    localStorage.setItem('hg-dark',dark);
  },[dark]);
  useEffect(()=>{ localStorage.setItem('hg-nav',nav); },[nav]);
  useEffect(()=>{
    const sel=localStorage.getItem('hg-sel');
    if(sel){const c=CANDIDATES.find(x=>x.id===+sel);if(c)setSelected(c);}
  },[]);
  useEffect(()=>{ localStorage.setItem('hg-sel',selected?.id??''); },[selected]);

  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  const setTweak=(k,v)=>{
    setTw(p=>{const n={...p,[k]:v};window.parent.postMessage({type:'__edit_mode_set_keys',edits:n},'*');return n;});
  };

  const goTo=(c,page)=>{ if(c)setSelected(c); if(page)setNav(page); };
  const density=tw.density==="compact"?"16px 18px":tw.density==="spacious"?"28px 26px":"22px 22px";
  const accent=`oklch(0.62 0.12 ${tw.accentHue})`;

  return (
    <div style={{display:"flex",height:"100vh",overflow:"hidden",fontSize:`${tw.fontScale*15}px`,
      '--accent':accent,'--accent-dim':`oklch(0.62 0.12 ${tw.accentHue}/0.12)`,'--accent-mid':`oklch(0.62 0.12 ${tw.accentHue}/0.25)`}}>

      {/* Sidebar */}
      <aside style={{width:collapsed?62:228,flexShrink:0,background:"var(--bg-2)",borderRight:"1px solid var(--border)",
        display:"flex",flexDirection:"column",overflow:"hidden",
        transition:"width var(--tr-s)"}}>
        {/* Logo */}
        <div style={{padding:collapsed?"18px 0":"18px 18px",display:"flex",alignItems:"center",
          justifyContent:collapsed?"center":"space-between",borderBottom:"1px solid var(--border)",minHeight:62}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:30,height:30,borderRadius:8,background:"var(--accent)",flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px var(--accent-mid)"}}>
              <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
                <path d="M8 1.5L2 4v4c0 3 2.5 5.5 6 6.5 3.5-1 6-3.5 6-6.5V4L8 1.5z" fill="white" fillOpacity="0.92"/>
                <path d="M5.5 8l1.8 1.8L10.5 6" stroke="white" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            {!collapsed&&<span style={{fontSize:15,fontWeight:600,letterSpacing:"-0.025em",whiteSpace:"nowrap"}}>HireGuard</span>}
          </div>
          {!collapsed&&(
            <button onClick={()=>setCollapsed(true)} style={{background:"none",border:"none",cursor:"pointer",
              color:"var(--fg-3)",padding:4,borderRadius:4,display:"flex",transition:"color var(--tr)"}}
              onMouseEnter={e=>e.currentTarget.style.color="var(--fg)"}
              onMouseLeave={e=>e.currentTarget.style.color="var(--fg-3)"}>
              <Icon d="M11 19l-7-7 7-7" size={14}/>
            </button>
          )}
          {collapsed&&(
            <button onClick={()=>setCollapsed(false)} style={{position:"absolute",background:"none",border:"none"}}/>
          )}
        </div>
        {collapsed&&(
          <div style={{display:"flex",justifyContent:"center",padding:"8px 0 2px"}}>
            <button onClick={()=>setCollapsed(false)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--fg-3)",padding:6,borderRadius:4,display:"flex"}}>
              <Icon d="M9 5l7 7-7 7" size={14}/>
            </button>
          </div>
        )}
        <nav style={{flex:1,padding:"10px 8px",display:"flex",flexDirection:"column",gap:2}}>
          {NAV.map(item=>{
            const active=nav===item.id;
            return (
              <button key={item.id} onClick={()=>setNav(item.id)} style={{
                display:"flex",alignItems:"center",gap:11,padding:collapsed?"11px 0":"10px 11px",
                justifyContent:collapsed?"center":"flex-start",borderRadius:"var(--r-sm)",
                background:active?"var(--accent-dim)":"transparent",
                color:active?"var(--accent)":"var(--fg-2)",
                border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13.5,
                fontWeight:active?500:400,width:"100%",textAlign:"left",position:"relative",
                transition:"background var(--tr),color var(--tr)",
              }}
              onMouseEnter={e=>{if(!active){e.currentTarget.style.background="var(--bg-3)";e.currentTarget.style.color="var(--fg)"}}}
              onMouseLeave={e=>{if(!active){e.currentTarget.style.background="transparent";e.currentTarget.style.color="var(--fg-2)"}}}>
                {active&&<div style={{position:"absolute",left:0,top:"18%",bottom:"18%",width:3,background:"var(--accent)",borderRadius:99}}/>}
                <span style={{flexShrink:0,marginLeft:active&&!collapsed?3:0}}><Icon d={item.icon} size={16}/></span>
                {!collapsed&&<span style={{whiteSpace:"nowrap"}}>{item.label}</span>}
              </button>
            );
          })}
        </nav>
        {!collapsed&&(
          <div style={{padding:"13px 16px",borderTop:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10}}>
            <Avatar initials="SL" size={30}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Sarah Lee</div>
              <div style={{fontSize:11.5,color:"var(--fg-3)"}}>HR Manager</div>
            </div>
          </div>
        )}
      </aside>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <header style={{height:58,flexShrink:0,borderBottom:"1px solid var(--border)",
          display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 24px",background:"var(--bg)"}}>
          <h1 style={{fontSize:16,fontWeight:500,letterSpacing:"-0.015em"}}>{NAV.find(n=>n.id===nav)?.label}</h1>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button style={{display:"flex",alignItems:"center",gap:7,padding:"7px 14px",borderRadius:"var(--r-sm)",
              background:"var(--accent)",color:"#fff",border:"none",fontSize:13,fontWeight:500,cursor:"pointer",
              fontFamily:"inherit",boxShadow:"0 2px 6px var(--accent-mid)",transition:"opacity var(--tr),transform var(--tr)"}}
              onMouseEnter={e=>{e.currentTarget.style.opacity="0.88";e.currentTarget.style.transform="translateY(-1px)"}}
              onMouseLeave={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.transform="translateY(0)"}}>
              <Icon d="M12 4v16m8-8H4" size={14}/>New Candidate
            </button>
            {[
              {icon:dark?"M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73l.71.71M1 12h1m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M16 12a4 4 0 11-8 0 4 4 0 018 0z":"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",onClick:()=>setDark(!dark),badge:false},
              {icon:"M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9",badge:true},
            ].map((b,i)=>(
              <button key={i} onClick={b.onClick} style={{width:36,height:36,borderRadius:"var(--r-sm)",
                background:"var(--bg-2)",border:"1px solid var(--border)",display:"flex",alignItems:"center",
                justifyContent:"center",cursor:"pointer",color:"var(--fg-2)",position:"relative",
                transition:"background var(--tr),transform var(--tr)"}}
                onMouseEnter={e=>{e.currentTarget.style.background="var(--bg-3)";e.currentTarget.style.transform="scale(1.06)"}}
                onMouseLeave={e=>{e.currentTarget.style.background="var(--bg-2)";e.currentTarget.style.transform="scale(1)"}}>
                <Icon d={b.icon} size={16}/>
                {b.badge&&<div style={{position:"absolute",top:7,right:7,width:6,height:6,borderRadius:"50%",background:"var(--red)",border:"1.5px solid var(--bg-2)"}}/>}
              </button>
            ))}
          </div>
        </header>
        <main style={{flex:1,overflow:"auto",padding:density,background:"var(--bg)"}}>
          {nav==="dashboard"&&<DashboardView onGo={goTo}/>}
          {nav==="candidates"&&<CandidatesView selected={selected} onSelect={setSelected}/>}
          {nav==="checks"&&<ChecksView/>}
          {nav==="reports"&&<ReportsView/>}
          {nav==="settings"&&<SettingsView/>}
        </main>
      </div>

      {/* Tweaks */}
      {tweaks&&(
        <div style={{position:"fixed",bottom:20,right:20,background:"var(--bg-2)",border:"1px solid var(--border)",
          borderRadius:14,padding:"18px 20px",width:248,boxShadow:"var(--shadow-lg)",zIndex:999,animation:"scaleIn 0.25s both"}}>
          <div style={{fontSize:13.5,fontWeight:600,marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            Tweaks
            <button onClick={()=>setTweaks(false)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--fg-3)",padding:2}}>
              <Icon d="M6 18L18 6M6 6l12 12" size={14}/>
            </button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:15}}>
            <div>
              <label style={{fontSize:11.5,color:"var(--fg-3)",display:"block",marginBottom:7}}>Accent Hue</label>
              <div style={{display:"flex",gap:7}}>
                {[210,155,280,45,10].map(h=>(
                  <button key={h} onClick={()=>setTweak('accentHue',h)} style={{
                    width:26,height:26,borderRadius:"50%",background:`oklch(0.62 0.12 ${h})`,
                    border:tw.accentHue===h?"2.5px solid var(--fg)":"2.5px solid transparent",
                    cursor:"pointer",transition:"transform var(--tr),border-color var(--tr)",
                    transform:tw.accentHue===h?"scale(1.18)":"scale(1)",
                  }}/>
                ))}
              </div>
            </div>
            <div>
              <label style={{fontSize:11.5,color:"var(--fg-3)",display:"block",marginBottom:7}}>Density</label>
              <div style={{display:"flex",gap:4}}>
                {["compact","comfortable","spacious"].map(d=>(
                  <button key={d} onClick={()=>setTweak('density',d)} style={{
                    flex:1,fontSize:11,padding:"5px 4px",borderRadius:6,
                    border:`1px solid ${tw.density===d?"var(--accent)":"var(--border)"}`,
                    background:tw.density===d?"var(--accent-dim)":"var(--bg-3)",
                    color:tw.density===d?"var(--accent)":"var(--fg-3)",
                    cursor:"pointer",fontFamily:"inherit",textTransform:"capitalize",transition:"all var(--tr)",
                  }}>{d}</button>
                ))}
              </div>
            </div>
            <div>
              <label style={{fontSize:11.5,color:"var(--fg-3)",display:"block",marginBottom:7}}>Font Scale — {tw.fontScale}×</label>
              <input type="range" min={0.85} max={1.15} step={0.05} value={tw.fontScale}
                onChange={e=>setTweak('fontScale',+e.target.value)}
                style={{width:"100%",accentColor:"var(--accent)"}}/>
            </div>
            <div style={{paddingTop:4,borderTop:"1px solid var(--border-2)"}}>
              <button onClick={()=>setDark(!dark)} style={{width:"100%",padding:"8px",borderRadius:"var(--r-sm)",
                background:"var(--bg-3)",border:"1px solid var(--border)",color:"var(--fg-2)",fontSize:13,
                cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:7,
                transition:"background var(--tr)"}}>
                <Icon d={dark?"M12 3v1m0 16v1M4.22 4.22l.71.71m12.73 12.73l.71.71M1 12h1m20 0h-1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M16 12a4 4 0 11-8 0 4 4 0 018 0z":"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"} size={14}/>
                {dark?"Light Mode":"Dark Mode"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
